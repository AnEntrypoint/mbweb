name: pages

# PRD-06: build the WASIp3 component, smoke-test it in Chromium, and publish the stick-figure page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Cache wasi-sdk 34.0
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/wasi-sdk-34.0-x86_64-linux
          key: wasi-sdk-34.0-${{ hashFiles('scripts/fetch-wasi-sdk.sh') }}

      - name: Cache component tools
        id: tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/wasm-tools
            ~/.cargo/bin/wit-bindgen
          key: component-tools-wasm-tools-1.262.0-wit-bindgen-0.63.0

      - name: Install component tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked wasm-tools --version 1.262.0
          cargo install --locked wit-bindgen-cli --version 0.63.0

      - name: Install Ninja
        run: command -v ninja || sudo apt-get install -y ninja-build

      - name: Install npm dependencies
        run: npm ci

      - name: Build the component (PRD-01, PRD-02, PRD-03)
        run: scripts/build-component.sh

      - name: Native inference check (PRD-02)
        run: |
          command -v clang >/dev/null || sudo apt-get install -y clang
          scripts/native-check.sh

      - name: Install Chromium for the smoke test
        run: npx --yes playwright@1.55.1 install --with-deps chromium

      - name: Build the threaded core (wasm32-wasip1-threads)
        run: scripts/build-threads.sh

      - name: Assemble the site
        run: scripts/build-site.sh

      - name: Keep the assembled site for the WebKit job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: site
          retention-days: 1

      - name: Smoke test in Chromium (PRD-04, PRD-05)
        run: npm run smoke

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Safari's engine: the same smoke checks in WebKit on a macOS runner, with the site the build job assembled.
  webkit:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download the assembled site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: site

      - name: Install WebKit
        run: npx --yes playwright@1.55.1 install webkit

      - name: Smoke test in WebKit (Safari engine)
        run: npm run smoke
        env:
          BROWSER: webkit
